spring:
  application:
    name: user-service

  datasource:
    # localhost aur port 5433 use karein
    url: jdbc:postgresql://localhost:5433/fitness_user_db
    username: postgres
    password: "@Coding1@"
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    # Hibernate automatically dialect detect kar leta hai,
    # naye versions mein iski zaroorat nahi hoti.

server:
  port: 8081

eureka:
  client:
    serviceUrl:
      # Local Eureka ke liye localhost:8761
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka/}